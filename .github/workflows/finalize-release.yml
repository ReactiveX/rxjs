name: Finalize staged release

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    name: Finalize fully approved release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with: { node-version: '24', package-manager-cache: false }
      - name: Publish immutable GitHub Releases only after all four packages are public
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[] | select(.draft == true) | .tag_name' | while read -r version; do
            candidate_dir="$RUNNER_TEMP/$version"
            mkdir -p "$candidate_dir"
            gh release download "$version" --pattern release-manifest.json --dir "$candidate_dir"
            if node scripts/release/finalize-release.mjs "$candidate_dir/release-manifest.json"; then
              if [[ "$version" == *-* ]]; then
                gh release edit "$version" --draft=false --prerelease --latest=false
              else
                gh release edit "$version" --draft=false --latest
              fi
            fi
          done
