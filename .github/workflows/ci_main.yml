name: CI

on:
  pull_request:
    types: ['opened', 'reopened', 'synchronize']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['18', '20']

    name: Node ${{ matrix.node }} build

    steps:
      - uses: actions/checkout@v4

      - name: Install Dependencies
        uses: ./.github/actions/install-dependencies
        with:
          node-version: ${{ matrix.node }}

      - name: Build, test and lint all projects (except website)
        run: pnpm nx run-many -t build lint test --exclude=rxjs.dev

      - name: rxjs lint
        run: pnpm --filter rxjs run lint
      - name: rxjs build
        run: pnpm --filter rxjs run build
      - name: rxjs test
        run: pnpm --filter rxjs run test
      - name: rxjs dtslint
        run: pnpm --filter rxjs run dtslint
      - name: rxjs test:import
        run: pnpm --filter rxjs run test:import
      - name: rxjs test:esm
        run: pnpm --filter rxjs run test:esm
      - name: rxjs.dev build
        run: pnpm --filter rxjs.dev run build -- --prod
      - name: rxjs.dev test
        run: pnpm --filter rxjs.dev run test -- --watch=false --browsers=ChromeHeadless
