name: Qualify RxJS 9 release

on:
  push:
    branches: ['master']
    paths:
      - 'CHANGELOG.md'
      - 'packages/migrate/package.json'
      - 'packages/observable-polyfill/package.json'
      - 'packages/rxjs/package.json'
      - 'packages/test/package.json'

permissions:
  contents: read

concurrency:
  group: rxjs-9-release-qualification
  cancel-in-progress: false

env:
  BUILD_ARTIFACT_PREFIX: rxjs-release-build-${{ github.run_id }}
  CORE_ARTIFACT: rxjs-release-core-${{ github.run_id }}
  CANDIDATE_ARTIFACT: rxjs-release-candidate-${{ github.run_id }}
  RELEASE_EXPECTED_SOURCE_COMMIT: ${{ github.sha }}

jobs:
  build:
    name: Independent clean build ${{ matrix.build }}
    strategy:
      fail-fast: false
      matrix: { build: [a, b] }
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: pnpm/action-setup@9fd676a19091d4595eefd76e4bd31c97133911f1 # v4.2.0
        with: { version: 10.34.5, run_install: false }
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with: { node-version: '24.12.0', package-manager-cache: false }
      - name: Verify that the generated release PR authorized this commit
        id: authorize
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          pr_number=$(node scripts/release/authorize-release-commit.mjs "$GITHUB_REPOSITORY" "$GITHUB_SHA")
          echo "pull-request=$pr_number" >> "$GITHUB_OUTPUT"
      - name: Fresh frozen dependency install with no restored cache
        run: pnpm install --frozen-lockfile
      - name: Verify release policy and repository configuration
        run: pnpm run release:check
      - name: Build release packages
        run: pnpm run prepare-packages
      - name: Pack, inventory, and hash this independent candidate
        env:
          RELEASE_AUTHORIZING_PR: ${{ steps.authorize.outputs.pull-request }}
          RELEASE_BUILD_ID: ${{ matrix.build }}
          RELEASE_RUNNER_IMAGE: ubuntu-24.04
        run: node scripts/release/release-candidate.mjs build .release/candidate
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.BUILD_ARTIFACT_PREFIX }}-${{ matrix.build }}
          path: .release/candidate
          if-no-files-found: error
          retention-days: 7

  compare:
    name: Require byte-identical independent builds
    needs: build
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.details.outputs.version }}
      pull-request: ${{ steps.details.outputs.pull-request }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with: { node-version: '24.12.0', package-manager-cache: false }
      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with: { pattern: 'rxjs-release-build-${{ github.run_id }}-*', path: .release/builds }
      - run: >-
          node scripts/release/compare-release-candidates.mjs
          .release/builds/rxjs-release-build-${{ github.run_id }}-a
          .release/builds/rxjs-release-build-${{ github.run_id }}-b
          .release/candidate
      - id: details
        run: |
          echo "version=$(node -e 'console.log(require("./.release/candidate/release-manifest.json").version)')" >> "$GITHUB_OUTPUT"
          echo "pull-request=$(node -e 'console.log(require("./.release/candidate/release-manifest.json").authorizingPullRequest)')" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: { name: '${{ env.CORE_ARTIFACT }}', path: .release/candidate, if-no-files-found: error, retention-days: 7 }

  package:
    name: Exact tarballs / package, type, import, and migration gates
    needs: compare
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@9fd676a19091d4595eefd76e4bd31c97133911f1 # v4.2.0
        with: { version: 10.34.5, run_install: false }
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with: { node-version: '24.12.0', package-manager-cache: false }
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with: { name: '${{ env.CORE_ARTIFACT }}', path: .release/candidate }
      - run: node scripts/release/release-candidate.mjs verify .release/candidate && node scripts/release/release-candidate.mjs hydrate .release/candidate
      - name: Run package source and lifecycle properties
        run: |
          pnpm --filter @rxjs/observable-polyfill --filter @rxjs/test --filter @rxjs/migrate run test
          pnpm --filter rxjs exec vitest --run src
      - name: Type-check and exercise the hydrated canonical packages
        run: |
          pnpm --filter @rxjs/observable-polyfill --filter @rxjs/test --filter @rxjs/migrate --filter rxjs run test:types
          pnpm --filter @rxjs/observable-polyfill --filter @rxjs/test --filter @rxjs/migrate --filter rxjs run test:imports
          pnpm --filter @rxjs/migrate run test:pack
          pnpm --filter rxjs run test:migration-contracts

  node:
    name: Exact tarballs / Node ${{ matrix.node }}${{ matrix.advisory && ' (advisory)' || '' }}
    needs: compare
    runs-on: ubuntu-24.04
    continue-on-error: ${{ matrix.advisory }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { node: '22.13.0', advisory: false }
          - { node: '24.12.0', advisory: false }
          - { node: '26', advisory: true }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@9fd676a19091d4595eefd76e4bd31c97133911f1 # v4.2.0
        with: { version: 10.34.5, run_install: false }
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with: { node-version: '${{ matrix.node }}', package-manager-cache: false }
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with: { name: '${{ env.CORE_ARTIFACT }}', path: .release/candidate }
      - run: node scripts/release/release-candidate.mjs verify .release/candidate && node scripts/release/release-candidate.mjs hydrate .release/candidate
      - run: pnpm run test:release:runtime

  browser:
    name: Exact tarballs / browsers, Webpack, performance
    needs: compare
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@9fd676a19091d4595eefd76e4bd31c97133911f1 # v4.2.0
        with: { version: 10.34.5, run_install: false }
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with: { node-version: '24.12.0', package-manager-cache: false }
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with: { name: '${{ env.CORE_ARTIFACT }}', path: .release/candidate }
      - run: node scripts/release/release-candidate.mjs verify .release/candidate && node scripts/release/release-candidate.mjs hydrate .release/candidate
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - run: pnpm run test:release:browsers && pnpm run test:release:webpack && pnpm run test:release:performance

  alternate-runtime:
    name: Exact tarballs / ${{ matrix.runtime }}
    needs: compare
    runs-on: ubuntu-24.04
    strategy: { fail-fast: false, matrix: { runtime: [deno, bun] } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@9fd676a19091d4595eefd76e4bd31c97133911f1 # v4.2.0
        with: { version: 10.34.5, run_install: false }
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with: { node-version: '24.12.0', package-manager-cache: false }
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with: { name: '${{ env.CORE_ARTIFACT }}', path: .release/candidate }
      - run: node scripts/release/release-candidate.mjs verify .release/candidate && node scripts/release/release-candidate.mjs hydrate .release/candidate
      - if: matrix.runtime == 'deno'
        uses: denoland/setup-deno@667a34cdef165d8d2b2e98dde39547c9daac7282 # v2.0.5
        with: { deno-version: v2.8.0 }
      - if: matrix.runtime == 'bun'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with: { bun-version: 1.3.14 }
      - if: matrix.runtime == 'deno'
        run: deno run --allow-read packages/rxjs/test/release/runtime-contract.mjs
      - if: matrix.runtime == 'bun'
        run: bun packages/rxjs/test/release/runtime-contract.mjs

  safari:
    name: Exact tarballs / ${{ matrix.target }} Safari
    needs: compare
    runs-on: macos-15
    strategy: { fail-fast: false, matrix: { target: [desktop, ios] } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@9fd676a19091d4595eefd76e4bd31c97133911f1 # v4.2.0
        with: { version: 10.34.5, run_install: false }
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with: { node-version: '24.12.0', package-manager-cache: false }
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with: { name: '${{ env.CORE_ARTIFACT }}', path: .release/candidate }
      - run: node scripts/release/release-candidate.mjs verify .release/candidate && node scripts/release/release-candidate.mjs hydrate .release/candidate
      - run: sudo safaridriver --enable
      - if: matrix.target == 'ios'
        run: node packages/rxjs/test/release/boot-ios-simulator.mjs
      - run: pnpm run test:release:safari:${{ matrix.target }}

  wpt:
    name: Exact tarballs / pinned Observable WPT
    needs: compare
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@9fd676a19091d4595eefd76e4bd31c97133911f1 # v4.2.0
        with: { version: 10.34.5, run_install: false }
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with: { node-version: '24.12.0', package-manager-cache: false }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: '3.11' }
      - run: sudo apt-get update && sudo apt-get install --yes libatspi2.0-dev libcairo2-dev libgirepository1.0-dev pkg-config
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with: { name: '${{ env.CORE_ARTIFACT }}', path: .release/candidate }
      - run: node scripts/release/release-candidate.mjs verify .release/candidate && node scripts/release/release-candidate.mjs hydrate .release/candidate
      - run: pnpm run test:wpt

  evidence:
    name: SBOM, clean release OSV scan, attestations, and authorization summary
    needs: [compare, package, node, browser, alternate-runtime, safari, wpt]
    runs-on: ubuntu-24.04
    permissions:
      attestations: write
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with: { node-version: '24.12.0', package-manager-cache: false }
      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with: { name: '${{ env.CORE_ARTIFACT }}', path: .release/candidate }
      - name: Install checked npm and generate scripts-disabled local release-train SBOM
        run: |
          npm_bin=$(node scripts/release/install-pinned-npm.mjs "$RUNNER_TEMP/npm-cli")
          echo "$(dirname "$npm_bin")" >> "$GITHUB_PATH"
          export PATH="$(dirname "$npm_bin"):$PATH"
          npm --version
          node scripts/release/generate-release-evidence.mjs .release/candidate
      - name: Scan the isolated release train with no monorepo exceptions
        uses: google/osv-scanner-action/osv-scanner-action@9a498708959aeaef5ef730655706c5a1df1edbc2 # v2.3.8
        with:
          scan-args: |-
            --format=json
            --output-file=.release/candidate/rxjs-${{ needs.compare.outputs.version }}.osv.json
            --lockfile=package-lock.json:.release/candidate/rxjs-${{ needs.compare.outputs.version }}.release-lock.json
      - run: node scripts/release/release-candidate.mjs record-evidence .release/candidate rxjs-${{ needs.compare.outputs.version }}.osv.json
      - name: Attest exact npm tarballs
        id: attest
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with: { subject-path: '.release/candidate/*.tgz' }
      - name: Preserve the portable attestation bundle
        run: |
          cp "${{ steps.attest.outputs.bundle-path }}" ".release/candidate/rxjs-${{ needs.compare.outputs.version }}.intoto.jsonl"
          node scripts/release/release-candidate.mjs record-evidence .release/candidate rxjs-${{ needs.compare.outputs.version }}.intoto.jsonl
      - name: Publish typed authorization values without staging
        run: |
          digest=$(node scripts/release/release-candidate.mjs manifest-digest .release/candidate)
          {
            echo '# RxJS release qualification succeeded'
            echo ''
            echo 'No npm stage was created. To authorize staging, manually run **Stage qualified RxJS 9 release** with:'
            echo ''
            echo "- qualification run ID: \`${GITHUB_RUN_ID}\`"
            echo "- version: \`${{ needs.compare.outputs.version }}\`"
            echo "- release-manifest.json SHA-512: \`${digest}\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.CANDIDATE_ARTIFACT }}
          path: .release/candidate
          if-no-files-found: error
          retention-days: 30
