name: Generate release PR

on:
  workflow_run:
    workflows: ['Release readiness']
    types: [completed]
  workflow_dispatch:
    inputs:
      mode:
        description: Release mode
        required: true
        default: auto
        type: choice
        options: [auto, promote-stable]

permissions:
  contents: read

concurrency:
  group: rxjs-9-release-pr
  cancel-in-progress: true

jobs:
  release-pr:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master') ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'master' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    steps:
      - name: Mint short-lived release App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-checks: read
          permission-contents: write
          permission-pull-requests: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - uses: pnpm/action-setup@9fd676a19091d4595eefd76e4bd31c97133911f1 # v4.2.0
        with:
          version: 10.34.5
          run_install: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24.12.0'
          package-manager-cache: false

      - name: Wait for every configured master check
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RELEASE_REQUIRED_CHECKS: ${{ vars.RELEASE_REQUIRED_CHECKS }}
        run: node scripts/release/wait-for-required-checks.mjs "$GITHUB_REPOSITORY" "${{ github.event.workflow_run.head_sha || github.sha }}"

      - name: Install from the frozen lockfile without caches
        run: pnpm install --frozen-lockfile

      - name: Generate versions, changelog, and release PR body
        id: plan
        env:
          NPM_STAGED_PACKAGES_URL: ${{ vars.NPM_STAGED_PACKAGES_URL }}
          RELEASE_MODE: ${{ inputs.mode || 'auto' }}
        run: |
          node scripts/release/prepare-release-pr.mjs --mode "$RELEASE_MODE" --output "$RUNNER_TEMP/release-pr.md" --result "$RUNNER_TEMP/release-result.json"
          status=$(node -e "console.log(JSON.parse(require('node:fs').readFileSync(process.argv[1])).status)" "$RUNNER_TEMP/release-result.json")
          echo "status=$status" >> "$GITHUB_OUTPUT"
          if [ "$status" = planned ]; then
            version=$(node -e "console.log(JSON.parse(require('node:fs').readFileSync(process.argv[1])).version)" "$RUNNER_TEMP/release-result.json")
            echo "version=$version" >> "$GITHUB_OUTPUT"
          fi

      - name: Update the lockfile without lifecycle scripts
        if: steps.plan.outputs.status == 'planned'
        run: pnpm install --lockfile-only --ignore-scripts

      - name: Enforce the release-bot file boundary
        if: steps.plan.outputs.status == 'planned'
        run: node scripts/release/check-release-bot-diff.mjs HEAD

      - name: Refresh the single release PR
        if: steps.plan.outputs.status == 'planned'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          git config user.name "rxjs-release-app[bot]"
          git config user.email "rxjs-release-app[bot]@users.noreply.github.com"
          if git ls-remote --exit-code origin refs/heads/release/rxjs-9 >/dev/null; then
            git fetch origin refs/heads/release/rxjs-9:refs/remotes/origin/release/rxjs-9
          fi
          git checkout -B release/rxjs-9
          git add CHANGELOG.md pnpm-lock.yaml packages/*/package.json packages/observable-polyfill/src/index.ts packages/observable-polyfill/test/import/esm.mjs packages/observable-polyfill/test/import/commonjs.cjs packages/rxjs/test/import/fixture-scenario.mjs packages/migrate/src/version.ts .agents/skills/rxjs-next-migration/.rxjs-migrate-skill.json
          git commit -m "chore(release): $VERSION"
          git push --force-with-lease origin release/rxjs-9
          pr_number=$(gh pr list --head release/rxjs-9 --state open --json number --jq '.[0].number')
          if [ -z "$pr_number" ]; then
            gh pr create --base master --head release/rxjs-9 --title "chore(release): $VERSION" --body-file "$RUNNER_TEMP/release-pr.md"
          else
            gh pr edit "$pr_number" --title "chore(release): $VERSION" --body-file "$RUNNER_TEMP/release-pr.md"
          fi

      - name: Block the 9.x train after a stable breaking change
        if: steps.plan.outputs.status == 'blocked'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh pr list --head release/rxjs-9 --state open --json number --jq '.[].number' | while read -r number; do gh pr close "$number" --comment "Release blocked: SemVer requires RxJS 10. No 9.x release is available."; done
