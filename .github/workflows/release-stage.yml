name: Stage qualified RxJS 9 release

on:
  workflow_dispatch:
    inputs:
      qualification_run_id:
        description: Successful qualification run ID
        required: true
        type: string
      version:
        description: Exact qualified version
        required: true
        type: string
      manifest_sha512:
        description: Exact release-manifest.json SHA-512
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: rxjs-9-npm-stage
  cancel-in-progress: false

env:
  RELEASE_OPERATOR_LOGIN: benlesh
  RELEASE_EXPECTED_SOURCE_COMMIT: ${{ github.sha }}

jobs:
  authorize:
    name: Verify typed manual authorization without npm authority
    if: github.ref == 'refs/heads/master' && github.actor == 'benlesh'
    runs-on: ubuntu-24.04
    outputs:
      source-commit: ${{ steps.details.outputs.source-commit }}
      pull-request: ${{ steps.details.outputs.pull-request }}
    permissions:
      actions: read
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { ref: '${{ github.sha }}', fetch-depth: 0, persist-credentials: false }
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with: { node-version: '24.12.0', package-manager-cache: false }
      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.qualification_run_id }}
          name: rxjs-release-candidate-${{ inputs.qualification_run_id }}
          path: .release/candidate
      - name: Reject wrong actor, run, branch, commit, version, digest, expiry, bytes, or replay
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ACTOR: ${{ github.actor }}
        run: >-
          node scripts/release/authorize-stage.mjs "$GITHUB_REPOSITORY"
          "${{ inputs.qualification_run_id }}" "${{ inputs.version }}"
          "${{ inputs.manifest_sha512 }}" .release/candidate
      - name: Reconfirm the generated release PR authorized this exact commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          expected=$(node -e 'console.log(require("./.release/candidate/release-manifest.json").authorizingPullRequest)')
          actual=$(node scripts/release/authorize-release-commit.mjs "$GITHUB_REPOSITORY" "$(git rev-parse HEAD)")
          test "$actual" = "$expected"
      - id: details
        run: |
          echo "source-commit=$(node -e 'console.log(require("./.release/candidate/release-manifest.json").sourceCommit)')" >> "$GITHUB_OUTPUT"
          echo "pull-request=$(node -e 'console.log(require("./.release/candidate/release-manifest.json").authorizingPullRequest)')" >> "$GITHUB_OUTPUT"

  stage:
    name: Reverify authorization and stage exact tarballs with npm OIDC
    needs: authorize
    runs-on: ubuntu-24.04
    environment: npm-stage
    permissions:
      actions: read
      attestations: read
      contents: write
      id-token: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { ref: '${{ needs.authorize.outputs.source-commit }}', fetch-depth: 0, persist-credentials: true }
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with: { node-version: '24.12.0', package-manager-cache: false }
      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.qualification_run_id }}
          name: rxjs-release-candidate-${{ inputs.qualification_run_id }}
          path: .release/candidate
      - name: Recheck current head, retained bytes, typed digest, and replay immediately before staging
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ACTOR: ${{ github.actor }}
        run: >-
          node scripts/release/authorize-stage.mjs "$GITHUB_REPOSITORY"
          "${{ inputs.qualification_run_id }}" "${{ inputs.version }}"
          "${{ inputs.manifest_sha512 }}" .release/candidate
      - name: Reconfirm the generated release PR again in the privileged job
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          expected="${{ needs.authorize.outputs.pull-request }}"
          actual=$(node scripts/release/authorize-release-commit.mjs "$GITHUB_REPOSITORY" "$(git rev-parse HEAD)")
          test "$actual" = "$expected"
      - name: Install the checked npm CLI only after registry SHA-512 verification
        run: |
          npm_bin=$(node scripts/release/install-pinned-npm.mjs "$RUNNER_TEMP/npm-cli")
          echo "$(dirname "$npm_bin")" >> "$GITHUB_PATH"
      - name: Verify GitHub attestations and candidate bytes again
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/release/release-candidate.mjs verify .release/candidate
          for tarball in .release/candidate/*.tgz; do gh attestation verify "$tarball" --repo "$GITHUB_REPOSITORY"; done
      - name: Create protected candidate tag and draft evidence release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag --annotate "$VERSION" --message "RxJS $VERSION qualified release candidate"
          git push origin "refs/tags/$VERSION"
          gh release create "$VERSION" --draft --verify-tag --title "RxJS $VERSION" --notes-file CHANGELOG.md .release/candidate/*
      - name: Stage exact attested tarballs with stage-only npm OIDC
        run: node scripts/release/stage-release.mjs publish .release/candidate .release/staged-release.json
      - name: Comment WebAuthn approval links, hashes, stage IDs, order, and CLI fallback
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          NPM_STAGED_PACKAGES_URL: ${{ vars.NPM_STAGED_PACKAGES_URL }}
        run: |
          test -f .release/staged-release.json
          pr_number=$(node -e 'console.log(require("./.release/candidate/release-manifest.json").authorizingPullRequest)')
          node scripts/release/stage-release.mjs comment .release/candidate .release/staged-release.json > "$RUNNER_TEMP/staging-comment.md"
          gh pr comment "$pr_number" --body-file "$RUNNER_TEMP/staging-comment.md"
      - name: Preserve staging receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rxjs-staging-receipt-${{ github.run_id }}
          path: .release/staged-release.json
          if-no-files-found: warn
          retention-days: 90
