name: Release doctor

on:
  schedule:
    - cron: '41 8 1 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  doctor:
    name: Read-only release doctor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false, fetch-depth: 0 }
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with: { node-version: '24', package-manager-cache: false }
      - env:
          GH_TOKEN: ${{ github.token }}
          NPM_STAGED_PACKAGES_URL: ${{ vars.NPM_STAGED_PACKAGES_URL }}
          RELEASE_REQUIRED_CHECKS: ${{ vars.RELEASE_REQUIRED_CHECKS }}
          RELEASE_TAG_RULESET_ID: ${{ vars.RELEASE_TAG_RULESET_ID }}
        run: node scripts/release/release-doctor.mjs --strict
